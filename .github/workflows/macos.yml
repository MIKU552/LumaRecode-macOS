name: macOS 27 Native Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Swift Core Unit Tests
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Select newest stable Xcode 27
        run: |
          if [ -d /Applications/Xcode_27.2.app/Contents/Developer ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_27.2.app/Contents/Developer" >> "$GITHUB_ENV"
          fi
      - name: Confirm macOS 27 toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
      - name: Run Swift core tests
        run: swift test --package-path macOS/Packages/LumaCore

  media-smoke:
    name: Real FFmpeg Software Transcode Smoke Test
    needs: core-tests
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Select newest stable Xcode 27
        run: |
          if [ -d /Applications/Xcode_27.2.app/Contents/Developer ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_27.2.app/Contents/Developer" >> "$GITHUB_ENV"
          fi
      - name: Install full native macOS FFmpeg and require zscale
        run: |
          brew install ffmpeg-full
          FULL_BIN="$(brew --prefix ffmpeg-full)/bin"
          echo "$FULL_BIN" >> "$GITHUB_PATH"
          export PATH="$FULL_BIN:$PATH"
          command -v ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          ffmpeg -hide_banner -encoders | grep -E 'libx264|libx265'
          ffmpeg -hide_banner -filters | grep -E '[[:space:]]zscale[[:space:]]'
      - name: Build Swift CLI
        run: swift build --package-path macOS/Packages/LumaCore --configuration release --product lumarecode
      - name: Probe, plan, convert, and verify synthetic SDR video
        shell: bash
        run: |
          set -euxo pipefail
          WORK="${RUNNER_TEMP}/luma-media-smoke"
          mkdir -p "$WORK"
          trap 'result=$?; echo "Media smoke failed at line $LINENO: $BASH_COMMAND (exit $result)" >&2; for f in "$WORK"/*.jsonl; do if [ -f "$f" ]; then echo "== $f ==" >&2; tail -n 12 "$f" >&2; fi; done; exit "$result"' ERR
          CLI="$(swift build --package-path macOS/Packages/LumaCore --configuration release --show-bin-path)/lumarecode"
          SRC="$WORK/source.mp4"
          OUT="$WORK/archive.mkv"
          ffmpeg -hide_banner -loglevel error -f lavfi             -i 'testsrc2=duration=0.7:size=160x90:rate=24'             -f lavfi -i 'sine=frequency=440:duration=0.7'             -shortest -c:v libx264 -x264-params colorprim=bt709:transfer=bt709:colormatrix=bt709 -pix_fmt yuv420p -c:a aac -y "$SRC"
          "$CLI" probe "$SRC" --json > "$WORK/probe.json"
          grep -q '"sourceColor" : "sdr"' "$WORK/probe.json" || grep -q '"sourceColor":"sdr"' "$WORK/probe.json"
          "$CLI" frames "$SRC" > "$WORK/frame-index.json"
          python3 - "$WORK/frame-index.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as file:
              data = json.load(file)
          assert data["frames"] >= 12, data
          assert data["duration"] > 0 and "/" in data["time_base"], data
          assert data["first_pts"] <= data["last_pts"], data
          print("Exact PTS frame index:", data)
          PY
          "$CLI" plan "$SRC" --codec hevc --purpose archive --output "$OUT" > "$WORK/plan.jsonl"
          grep -q '"event":"plan"' "$WORK/plan.jsonl"
          "$CLI" convert "$SRC" --codec hevc --purpose archive --output "$OUT" --json > "$WORK/events.jsonl"
          test -s "$OUT"
          codec="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$OUT")"
          test "$codec" = "hevc"
          count="$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$OUT" | wc -l | tr -d ' ')"
          test "$count" -eq 1
          grep -q '"event":"done"' "$WORK/events.jsonl"
          echo "Software HEVC encode, audio preservation, output verification, and CLI JSON events passed."

      - name: Verify multitrack audio, range conversion, and fail-closed options
        run: bash macOS/ci/test-media-parity.sh

      - name: Verify PQ video to native HEIC10 pipeline
        env:
          LUMA_PQ_VIDEO_CI: "1"
        run: |
          swift test --package-path macOS/Packages/LumaCore \
            --filter AppleHDRPhotoTests/testExportsPQFrameFromNative10BitVideo

  native-app:
    name: Build Native SwiftUI App + CLI
    needs: core-tests
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Select newest stable Xcode 27
        run: |
          if [ -d /Applications/Xcode_27.2.app/Contents/Developer ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_27.2.app/Contents/Developer" >> "$GITHUB_ENV"
          fi
      - name: Prepare XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
      - name: Generate native Xcode project
        run: |
          xcodegen generate --spec macOS/project.yml
          test -d macOS/LumaRecode.xcodeproj
      - name: Build macOS application
        run: |
          xcodebuild \
            -project macOS/LumaRecode.xcodeproj \
            -scheme LumaRecode \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/LumaDerived" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Build native Swift CLI
        run: |
          swift build --package-path macOS/Packages/LumaCore \
            --configuration release --product lumarecode
      - name: Package unsigned developer artifacts
        run: |
          mkdir -p dist
          APP="$RUNNER_TEMP/LumaDerived/Build/Products/Release/LumaRecode.app"
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/LumaRecode-macOS27-arm64-unsigned.zip
          CLI="$(swift build --package-path macOS/Packages/LumaCore \
            --configuration release --show-bin-path)/lumarecode"
          cp "$CLI" dist/lumarecode-macOS27-arm64
          chmod +x dist/lumarecode-macOS27-arm64
          file dist/lumarecode-macOS27-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: LumaRecode-macOS27-native-dev
          path: dist/*
          if-no-files-found: error
          retention-days: 14
