name: LumaRecode
options:
  minimumXcodeGenVersion: 2.42.0
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  LumaCore:
    path: Packages/LumaCore
targets:
  LumaRecode:
    type: application
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: LumaRecodeApp
    dependencies:
      - package: LumaCore
      - package: LumaCore
        product: LumaPhotos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miku552.LumaRecodeMac
        PRODUCT_NAME: LumaRecode
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "映码 · LumaRecode"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save exported Live Photos to your photo library when requested."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Access selected Photos content when requested."
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets: []
